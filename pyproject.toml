[project]
name = "provender"
version = "0.1.5"
description = "Content-addressed blobs on an object store, for caches that several processes share"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# obstore and the standard library, nothing else. A consumer whose core imports only numpy
# must be able to import this without pulling a scientific stack in behind it, and obstore
# itself is imported at CALL time so `import provender` opens no sockets and reads no
# credentials.
dependencies = ["obstore>=0.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provender"]
